version: '3.8'

services:
  zookeeper:
    image: wurstmeister/zookeeper
    ports:
      - "2181:2181"
    environment:
      # Performance optimizations
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_MAX_CLIENT_CNXNS: 60
    networks:
      - flink-net
    restart: unless-stopped

  kafka:
    image: wurstmeister/kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Performance optimizations
      KAFKA_NUM_NETWORK_THREADS: 8
      KAFKA_NUM_IO_THREADS: 8
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 102400
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 102400
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Memory settings
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"
    volumes:
      - kafka_data:/kafka
    networks:
      - flink-net
    depends_on:
      - zookeeper
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Enhanced Redis with better performance configuration
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - flink-net
    command: >
      redis-server
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --tcp-keepalive 60
      --timeout 0
      --tcp-backlog 511
      --databases 1
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --maxclients 1000
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Enhanced Flink JobManager with better memory settings
  flink-jobmanager:
    image: flink:1.16.0-scala_2.12
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - FLINK_PROPERTIES=jobmanager.memory.process.size:2gb
        taskmanager.numberOfTaskSlots:4
        taskmanager.memory.process.size:4gb
        parallelism.default:4
        taskmanager.memory.managed.fraction:0.6
        taskmanager.memory.network.fraction:0.15
        state.backend:rocksdb
        state.backend.incremental:true
        execution.checkpointing.interval:60s
        execution.checkpointing.min-pause:30s
        execution.checkpointing.timeout:10min
    volumes:
      - ../flink_job/target:/opt/flink/usrlib
      - flink_checkpoints:/opt/flink/checkpoints
    networks:
      - flink-net
    depends_on:
      - kafka
      - redis
    restart: unless-stopped

  # Enhanced Flink TaskManager with better performance
  flink-taskmanager:
    image: flink:1.16.0-scala_2.12
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - TASK_MANAGER_NUMBER_OF_TASK_SLOTS=4
      - FLINK_PROPERTIES=taskmanager.memory.process.size:4gb
        taskmanager.memory.managed.fraction:0.6
        taskmanager.memory.network.fraction:0.15
        taskmanager.network.memory.buffers-per-channel:4
        taskmanager.network.memory.floating-buffers-per-gate:8
    volumes:
      - ../flink_job/target:/opt/flink/usrlib
    networks:
      - flink-net
    restart: unless-stopped
    deploy:
      replicas: 2  # Run 2 task managers for better parallelism

  # Enhanced Kafka Producer with faster settings
  kafka-producer:
    build:
      context: ../kafka_producer
      dockerfile: Dockerfile
    volumes:
      - ../kafka_producer:/app
    depends_on:
      kafka:
        condition: service_healthy
    command: ["/bin/sh", "-c", "./wait-for-kafka.sh kafka:9092 && python kafka_producer_all.py"]
    networks:
      - flink-net
    environment:
      - PRODUCER_DELAY=0.05
      - LOOP_MODE=true        # Enable continuous mode
      - LOOP_DELAY=30         # Wait 60 seconds between cycles
    restart: unless-stopped   # Auto-restart if container exits

  # NEW: FastAPI Dashboard Backend (replaces Flask)
  dashboard-backend:
    build:
      context: ../dashboard
      dockerfile: Dockerfile.fastapi
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKERS=4
      - LOG_LEVEL=info
    volumes:
      - ../dashboard:/app
    networks:
      - flink-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # OPTIONAL: Keep Flask dashboard for comparison (different port)
  dashboard-flask:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FLASK_ENV=production  # Changed from development for better performance
      - FLASK_DEBUG=0         # Disabled debug mode
    volumes:
      - ../dashboard:/app
    networks:
      - flink-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - flask  # Optional service, start with: docker-compose --profile flask up

networks:
  flink-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  redis_data:
    driver: local
  kafka_data:
    driver: local
  flink_checkpoints:
    driver: local